desc: "入力境界値: title(必須/最大80) と body(必須/最大4000) の BVA（RQ-003/004 / docs/30_test_design.md §3.3）"
# 各境界（無効下限=空 / 有効下限=1 / 有効上限=max / 無効上限=max+1）を一意な期待値で検証。
# 長大文字列(4001文字)を含むため本ファイルは自動生成している（手書きの4KBリテラルを避けるため）。
runners:
  req: "http://127.0.0.1:8000"
vars:
  password: pass1234
steps:
  login_req1:
    req:
      /api/auth/token/:
        post:
          body:
            application/json:
              username: requester1
              password: "{{ vars.password }}"
    test: current.res.status == 200
  title_empty:
    desc: "title 0文字（無効下限・必須エラー）-> 400"
    req:
      /api/tickets/:
        post:
          headers:
            Authorization: "Token {{ steps.login_req1.res.body.token }}"
          body:
            application/json:
              title: ""
              body: "valid body"
    test: current.res.status == 400
  title_1:
    desc: "title 1文字（有効下限）-> 201"
    req:
      /api/tickets/:
        post:
          headers:
            Authorization: "Token {{ steps.login_req1.res.body.token }}"
          body:
            application/json:
              title: "x"
              body: "valid body"
    test: current.res.status == 201
  title_80:
    desc: "title 80文字（有効上限）-> 201"
    req:
      /api/tickets/:
        post:
          headers:
            Authorization: "Token {{ steps.login_req1.res.body.token }}"
          body:
            application/json:
              title: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
              body: "valid body"
    test: current.res.status == 201
  title_81:
    desc: "title 81文字（無効上限）-> 400"
    req:
      /api/tickets/:
        post:
          headers:
            Authorization: "Token {{ steps.login_req1.res.body.token }}"
          body:
            application/json:
              title: "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"
              body: "valid body"
    test: current.res.status == 400
  body_empty:
    desc: "body 0文字（無効下限・必須エラー）-> 400"
    req:
      /api/tickets/:
        post:
          headers:
            Authorization: "Token {{ steps.login_req1.res.body.token }}"
          body:
            application/json:
              title: "valid title"
              body: ""
    test: current.res.status == 400
  body_1:
    desc: "body 1文字（有効下限）-> 201"
    req:
      /api/tickets/:
        post:
          headers:
            Authorization: "Token {{ steps.login_req1.res.body.token }}"
          body:
            application/json:
              title: "valid title"
              body: "x"
    test: current.res.status == 201
  body_4000:
    desc: "body 4000文字（有効上限）-> 201"
    req:
      /api/tickets/:
        post:
          headers:
            Authorization: "Token {{ steps.login_req1.res.body.token }}"
          body:
            application/json:
              title: "valid title"
              body: ""
    test: current.res.status == 201
  body_4001:
    desc: "body 4001文字（無効上限）-> 400"
    req:
      /api/tickets/:
        post:
          headers:
            Authorization: "Token {{ steps.login_req1.res.body.token }}"
          body:
            application/json:
              title: "valid title"
              body: ""
    test: current.res.status == 400
