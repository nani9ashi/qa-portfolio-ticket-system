name: CI Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  unit-test:
    name: Unit Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Run unit tests (policy.py)
        working-directory: ./app
        run: python -m pytest

  e2e-test:
    name: E2E Test (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # 1. コードのチェックアウト
      - uses: actions/checkout@v4

      # 2. Pythonのセットアップ
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      # 3. ライブラリのインストール
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # CJKフォント（証跡スクショで日本語が豆腐化するのを防ぐ）
          sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
          # Playwrightのブラウザ＋OS依存（--with-depsでlib類も自動解決）
          python -m playwright install --with-deps chromium

      # モデルとマイグレーションの不整合（ドリフト）を検知。未捕捉のモデル変更があれば失敗する。
      - name: Check for missing migrations
        env:
          SECRET_KEY: "django-insecure-test-key-do-not-use-in-production"
        run: |
          cd app
          python manage.py makemigrations --check --dry-run

      # 4. データベースの準備（マイグレーション & データ投入）
      - name: Prepare Database
        env:
          SECRET_KEY: "django-insecure-test-key-do-not-use-in-production"
        run: |
          cd app
          python manage.py migrate
          python manage.py seed_demo

      # 5. サーバー起動 & テスト実行
      - name: Run Server and Test
        env:
          SECRET_KEY: "django-insecure-test-key-do-not-use-in-production"
          BASE_URL: "http://127.0.0.1:8000"
        run: |
          # アプリ起動（バックグラウンド）
          cd app
          python manage.py runserver 127.0.0.1:8000 &

          # サーバーが立ち上がるまで少し待つ（5秒）
          sleep 5

          # テスト実行（ルートに戻ってからqaフォルダへ。pytest.iniのtestpaths=testsで自動探索）
          cd ../qa/automation
          python -m pytest

      # 6. 証跡のアップロード（成功・失敗問わず保存）
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-evidence
          path: qa/automation/evidence/auto/

  # API/インテグレーションテスト層（runn）。E2E とは独立した並列ジョブ。
  # 高速・決定的なので毎 push で実行する（テストピラミッド最適化）。
  api-test:
    name: API Test (runn)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 再現性のため runn のバージョンは固定する。
      - name: Install runn (pinned v1.9.2)
        run: |
          curl -sL https://github.com/k1LoW/runn/releases/download/v1.9.2/runn_v1.9.2_linux_amd64.tar.gz -o runn.tar.gz
          tar xzf runn.tar.gz runn
          sudo mv runn /usr/local/bin/runn
          runn --version

      - name: Prepare Database
        env:
          SECRET_KEY: "django-insecure-test-key-do-not-use-in-production"
        run: |
          cd app
          python manage.py migrate
          python manage.py seed_demo

      - name: Run Server and API Tests (runn)
        env:
          SECRET_KEY: "django-insecure-test-key-do-not-use-in-production"
        run: |
          cd app
          python manage.py runserver 127.0.0.1:8000 &
          sleep 5
          cd ..
          # runbook は自前でトークン取得＋データ生成するため seed_demo の既知ユーザーのみに依存。
          runn run "qa/api/runn/**/*.yml" --verbose < /dev/null | tee qa/api/runn_result.txt

      - name: Upload runn result
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-runn-result
          path: qa/api/runn_result.txt